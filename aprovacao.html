<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aprovação de Conteúdo — Impulse One</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080C;--card:#121219;--card2:#16161F;--ink:#fff;--soft:#A6A6B4;--dim:#6C6C7A;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);--acc:#EC1E79;--acc2:#F25FA8;--ok:#34d399;--no:#fb5d6b;--grad:linear-gradient(115deg,#F7941E,#EC1E79 40%,#A23BD6 70%,#29ABE2)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:80px}
.wrap{max-width:840px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:10;background:rgba(8,8,12,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hbar{height:5px;background:var(--grad)}
.hin{max-width:840px;margin:0 auto;padding:16px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
.brand img{height:30px}.brand .sq{width:24px;height:24px;border-radius:7px;background:var(--grad)}
.brand b{font-family:'Sora';font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:13px}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-family:'Sora';font-weight:700;font-size:11px;letter-spacing:.04em;padding:6px 11px;border-radius:99px;border:1px solid var(--line2);color:var(--soft)}
.pill b{color:#fff}
.pill.ok{color:var(--ok);border-color:rgba(52,211,153,.4)}.pill.no{color:var(--no);border-color:rgba(251,93,107,.4)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.filtros{display:flex;gap:6px}
.chip{cursor:pointer;font-family:'Sora';font-weight:600;font-size:11px;padding:6px 12px;border-radius:99px;border:1px solid var(--line2);color:var(--soft);background:transparent}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.btn{cursor:pointer;font-family:'Sora';font-weight:700;font-size:12px;padding:8px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--card);color:#fff}
.save{font-size:11px;color:var(--dim);margin-left:auto}
.intro{padding:22px 0 6px;color:var(--soft);font-size:14px;line-height:1.6}
.intro h1{font-family:'Sora';font-weight:800;font-size:26px;color:#fff;margin-bottom:6px;letter-spacing:-.01em}
.intro .per{color:var(--acc2);font-family:'Sora';font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:16px 0;position:relative;overflow:hidden}
.card.st-aprovado{border-color:rgba(52,211,153,.5)}
.card.st-reprovado{border-color:rgba(251,93,107,.5);opacity:.72}
.card .num{font-family:'Sora';font-weight:800;font-size:12px;letter-spacing:.18em;color:var(--acc2);text-transform:uppercase}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.tag{font-family:'Sora';font-weight:600;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:5px 10px}
.gan{font-size:12px;color:var(--dim);line-height:1.5;margin:6px 0 12px}
.hook{font-family:'Sora';font-weight:700;font-size:19px;line-height:1.32;color:#fff;margin-bottom:12px}
.lbl{font-family:'Sora';font-weight:700;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
ol.sl{margin:0 0 0 18px;display:flex;flex-direction:column;gap:5px}ol.sl li{font-size:13.5px;line-height:1.5;color:var(--soft)}
.peca{font-family:'Sora';font-weight:600;font-size:17px;line-height:1.3;color:#fff;background:var(--card2);border-radius:10px;padding:14px}
.leg{font-size:13.5px;line-height:1.6;color:var(--soft);white-space:pre-wrap}
.cta{margin-top:12px;padding:12px 14px;border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:10px;background:rgba(236,30,121,.07)}
.cta b{color:var(--acc2);font-family:'Sora';font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.cta p{color:#fff;font-size:13.5px;line-height:1.5;margin-top:3px}
.htags{margin-top:10px;color:var(--acc2);font-size:12.5px}
.actions{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.act{cursor:pointer;font-family:'Sora';font-weight:700;font-size:13px;padding:11px 18px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--soft);display:flex;align-items:center;gap:7px}
.act.ap.on{background:rgba(52,211,153,.16);border-color:var(--ok);color:var(--ok)}
.act.re.on{background:rgba(251,93,107,.16);border-color:var(--no);color:var(--no)}
.coment{flex:1;min-width:180px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:#fff;font-family:inherit;font-size:13px;padding:10px 12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#16161F;border:1px solid var(--line2);color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;transition:.2s;z-index:50}
.toast.show{opacity:1}
@media(max-width:600px){.intro h1{font-size:22px}.hook{font-size:17px}}
/* ===== mobile ===== */
.htop{display:flex;align-items:center;gap:12px;max-width:840px;margin:0 auto;padding:12px 18px}
.htop .brand{flex:1}
.hrow{display:flex;align-items:center;gap:10px;max-width:840px;margin:0 auto;padding:0 18px 10px}
.hrow .filtros{flex:1;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;scrollbar-width:none}
.hrow .filtros::-webkit-scrollbar{display:none}
.hrow .chip{flex:0 0 auto}
.hrow .btn{flex:0 0 auto}
header .counts{max-width:840px;margin:0 auto;padding:0 18px 10px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
header .counts::-webkit-scrollbar{display:none}
header .counts .pill{flex:0 0 auto}
.prog{height:4px;background:rgba(255,255,255,.08)}
.prog span{display:block;height:100%;width:0;background:var(--grad);transition:width .35s ease}
.act{min-height:48px;justify-content:center}
.coment{font-size:16px}
.save{white-space:nowrap}
@media(max-width:640px){
  .wrap,.htop,.hrow,header .counts{padding-left:14px;padding-right:14px}
  .htop{padding-top:10px;padding-bottom:10px}
  .intro{padding-top:18px;font-size:13px}.intro h1{font-size:20px}
  .card{padding:16px;border-radius:14px;margin:14px 0}
  .hook{font-size:17px}
  .num{font-size:11px}
  .actions{gap:8px}
  .act{flex:1 1 0;font-size:14px;padding:12px 8px}
  .coment{flex:1 1 100%;min-width:0;margin-top:2px}
  .btn{font-size:11px;padding:7px 11px}
  .brand img{height:26px}
  .pill{font-size:10.5px;padding:5px 9px}
}
</style></head><body>

const CONTEUDOS=[{"id":1,"pilar":"Bastidores e Prova","formato":"Carrossel","objetivo":"Meio","tema":"Demitimos um cliente","chamada":"Demitimos um cliente mês passado. E faríamos de novo.","gancho_tendencia":"Fadiga de conteudo por IA em 2026: o mercado premia marca com verdade e posicao.","gatilhos_mentais":["Autoridade","Inimigo comum","Storytelling","Escassez"],"slides":["Ele pagava em dia, elogiava as artes e indicava a gente. O cliente dos sonhos, no papel.","Mas toda reunião era a mesma frase: posta isso porque o concorrente postou.","A gente não trabalha pra copiar mercado. Trabalha pra construir marca.","Quando a estratégia vira refém da insegurança do cliente, o resultado morre junto.","Preferimos perder o contrato a entregar algo que sabemos que não vai funcionar. Não é arrogância, é respeito pelo que a gente faz."],"peca":"","legenda":"A escolha mais difícil de uma agência não é qual cliente aceitar. É qual recusar. Já abrimos mão de faturamento pra não abrir mão de método, porque marca construída no medo do concorrente não dura. Se você quer alguém que concorde com tudo, não somos a gente. Se você quer alguém que te diga a verdade na cara, senta que a conversa é boa.","cta":"Marca aqui a pessoa que mais precisa ler isso antes de fechar com a próxima agência. Ou manda VERDADE no direct e a gente conversa sem enrolação.","hashtags":["#marca","#posicionamento","#branding","#agenciademarketing"],"direcao_visual":"Capa preta, frase em Sora bold branca, acento em gradiente só no fecho. Sem foto, peso total na tipografia."},{"id":2,"pilar":"Educação de Mercado","formato":"Carrossel","objetivo":"Topo","tema":"Ninguém compra no primeiro post","chamada":"Ninguém compra no primeiro post. E tá tudo bem.","gancho_tendencia":"Cultura data-driven 2026: marcas querem provar que conteudo vira venda, nao vaidade.","gatilhos_mentais":["Antecipação","Contraste","Autoridade","Aversão a perda"],"slides":["A pressa de vender é o que mais estraga marca de empresa séria.","A pessoa precisa te ver, depois entender, depois confiar. Só então compra.","Quando você pula etapa, parece desespero. E desespero afasta cliente bom.","Conteúdo forte ocupa espaço na cabeça de quem ainda não está pronto. Pra quando estiver, lembrar de você primeiro."],"peca":"","legenda":"Existe uma obsessão por conversão imediata que quebra mais negócio do que salva. Venda é consequência de confiança, e confiança leva tempo. O perfil que só grita compra some no meio do feed. O perfil que conversa, fica. Qual dos dois é o seu hoje?","cta":"Responde em uma palavra: hoje o seu perfil grita ou conversa? Quem responder grita, a gente já sabe qual é o primeiro ajuste. Comenta CONFIANÇA.","hashtags":["#marketingdigital","#marca","#conteudoestrategico"],"direcao_visual":"Fundo grafite, números grandes (1, 2, 3) marcando as etapas ver, entender, confiar. Acento gradiente no passo final."},{"id":3,"pilar":"Autoridade e Método","formato":"Estatico","objetivo":"Meio","tema":"O que a gente realmente vende","chamada":"A gente não vende post. Vende o motivo de alguém escolher você e não o outro.","gancho_tendencia":"Saturacao de feeds genericos: percepcao e diferenciacao valem mais que alcance.","gatilhos_mentais":["Contraste","Autoridade","Especificidade"],"slides":[],"peca":"A gente não vende post. Vende o motivo de alguém escolher você e não o outro.","legenda":"Toda empresa tem um concorrente que faz quase a mesma coisa, quase pelo mesmo preço. O que decide a venda não é o produto, é a percepção. E percepção se constrói peça por peça, com intenção, enquanto os outros ainda discutem fonte e cor.","cta":"Quer ser a escolha óbvia do seu mercado, e não mais um orçamento na fila? Chama no direct com a palavra ÓBVIO.","hashtags":["#branding","#percepcaodemarca","#posicionamento"],"direcao_visual":"Peça única, tipografia editorial grande, muito respiro. Preto com uma única linha em gradiente sublinhando a palavra escolher."},{"id":4,"pilar":"Bastidores e Prova","formato":"Carrossel","objetivo":"Meio","tema":"A reunião que todo cliente odeia","chamada":"A reunião que todo cliente odeia. E a gente faz mesmo assim.","gancho_tendencia":"Autenticidade como vantagem em 2026: marca que sabe quem e se destaca no ruido.","gatilhos_mentais":["Autoridade","Curiosidade","Prova e demonstração"],"slides":["É a reunião onde a gente pergunta o que ninguém quer responder.","Por que alguém deveria comprar de você e não do concorrente? Silêncio.","Quem é o seu cliente, de verdade? Mais silêncio.","Dói porque é a base de tudo. Sem isso, conteúdo bonito é só enfeite caro.","Preferimos a pergunta desconfortável agora do que o resultado frustrante depois."],"peca":"","legenda":"A parte mais importante do nosso trabalho acontece antes de qualquer arte. É na pergunta difícil, a que expõe que a empresa nunca parou pra pensar quem ela é. Agência que pula essa etapa entrega volume. A gente entrega direção, que é o que falta na maioria dos perfis por aí.","cta":"Faz o teste agora: responde em voz alta por que comprariam de você. Travou? Esse é o nó. Manda BASE no direct que a gente desata.","hashtags":["#estrategiademarca","#branding","#marketing"],"direcao_visual":"Slides em estilo transcrição de reunião, perguntas em branco e o silêncio em cinza apagado. Tensão no espaço vazio."},{"id":5,"pilar":"Educação de Mercado","formato":"Estatico","objetivo":"Topo","tema":"Saturação de conteúdo e IA","chamada":"Nunca se produziu tanto conteúdo. E nunca se lembrou de tão pouco.","gancho_tendencia":"Fadiga de conteudo gerado por IA em 2026: o real e memoravel se destaca.","gatilhos_mentais":["Novidade","Inimigo comum","Contraste","Escassez"],"slides":[],"peca":"Nunca se produziu tanto conteúdo. E nunca se lembrou de tão pouco.","legenda":"A facilidade da IA virou armadilha. Todo mundo posta todo dia, tudo igual, tudo esquecível. No meio desse barulho, marca com voz própria não compete por atenção, ela domina. A gente não te ajuda a postar mais. Ajuda a ser lembrado, que é a única coisa que paga conta.","cta":"Cansou de ser esquecível no meio do feed automático? Comenta VOZ que a gente te mostra como soar diferente de todo mundo.","hashtags":["#iaeconteudo","#marca","#vozdemarca","#marketing2026"],"direcao_visual":"Fundo preto com ruído sutil de feed repetido em cinza, e uma única frase nítida em branco no centro. Contraste entre ruído e clareza."},{"id":6,"pilar":"Bastidores e Prova","formato":"Carrossel","objetivo":"Meio","tema":"O trabalho invisível","chamada":"O que a gente faz que você não vê. E é isso que muda tudo.","gancho_tendencia":"Profissionalizacao do conteudo em 2026: metodo vence o improviso que parece igual.","gatilhos_mentais":["Prova e demonstração","Autoridade","Reciprocidade"],"slides":["Você vê o post. Não vê as 3 versões que jogamos fora antes dele.","Você vê a legenda. Não vê a discussão de meia hora sobre uma única palavra.","Você vê o resultado. Não vê o estudo do seu mercado que veio antes.","O trabalho invisível é o que separa peça profissional de post improvisado."],"peca":"","legenda":"Tem uma camada inteira do nosso trabalho que nunca aparece pro cliente, e é justamente ela que faz a diferença. Improviso é barato e parece igual no começo. Só que o tempo cobra: marca construída no improviso desmonta na primeira dificuldade. A construída no método aguenta. A gente trabalha pra aguentar.","cta":"Quer ver esse método aplicado na sua marca antes de decidir qualquer coisa? Manda MÉTODO no direct que a gente te mostra na prática.","hashtags":["#processocriativo","#metodo","#branding"],"direcao_visual":"Camadas sobrepostas semitransparentes revelando o que está por trás do post final. Gradiente só na camada de baixo."},{"id":7,"pilar":"Provocação e Dor","formato":"Estatico","objetivo":"Topo","tema":"Top of mind","chamada":"Seu concorrente não está na sua frente porque é melhor. Está porque apareceu primeiro na cabeça do cliente.","gancho_tendencia":"Atencao fragmentada e microcomunidades: ser lembrado primeiro virou o ativo mais escasso.","gatilhos_mentais":["Inimigo comum","Aversão a perda","Autoridade"],"slides":[],"peca":"Seu concorrente não está na sua frente porque é melhor. Está porque apareceu primeiro na cabeça do cliente.","legenda":"Top of mind não é sobre qualidade, é sobre presença com consistência. Quem aparece com método ocupa o espaço mental do mercado. Quem aparece quando dá tempo briga por sobra de atenção. A gente não trabalha com sobra, trabalha pra você ser o primeiro nome que vem à cabeça.","cta":"Quer ser o primeiro nome lembrado no seu segmento, e não o plano B mais barato? Manda PRIMEIRO no direct.","hashtags":["#topofmind","#marca","#posicionamento"],"direcao_visual":"Dois nomes lado a lado, o do concorrente em foco e o do leitor desfocado atrás. Acento gradiente puxando o nome do leitor pra frente."},{"id":8,"pilar":"Provocação e Dor","formato":"Carrossel","objetivo":"Meio","tema":"O que a agência não te fala","chamada":"O que toda agência pensa, mas não tem coragem de te falar.","gancho_tendencia":"Marketing data-driven 2026: foco e venda acima de vaidade e viral.","gatilhos_mentais":["Inimigo comum","Autoridade","Contraste"],"slides":["Não precisa estar em toda rede. Precisa estar bem em uma.","Mais post não é mais resultado. Geralmente é mais cansaço.","Viralizar não paga conta. Vender paga.","A gente prefere te falar isso agora do que te ver gastando energia à toa."],"peca":"","legenda":"Existe muito conselho de marketing feito pra agradar, não pra ajudar. A verdade é menos vendável: foco vale mais que presença em tudo, e venda vale mais que viral. Quem te fala o contrário ou não sabe, ou está mais preocupado em parecer ocupado do que em te dar retorno. A gente escolheu o caminho chato de falar a real.","cta":"Salva esse post pra lembrar na próxima vez que te oferecerem mais do mesmo. E manda REAL no direct se quiser marketing sem papo furado.","hashtags":["#marketingsemenrolacao","#estrategia","#marca"],"direcao_visual":"Estilo lista de mito versus verdade, cada slide um par. Verdade sempre destacada em branco sobre preto."},{"id":9,"pilar":"Autoridade e Método","formato":"Estatico","objetivo":"Topo","tema":"Manifesto de marca","chamada":"Marca não é o que você diz que é. É o que sobra na cabeça de quem te viu.","gancho_tendencia":"Era da percepcao: em 2026 a marca e o que sobra na cabeca, nao o que se anuncia.","gatilhos_mentais":["Autoridade","Especificidade","Pertencimento"],"slides":[],"peca":"Marca não é o que você diz que é. É o que sobra na cabeça de quem te viu.","legenda":"Você não controla a sua marca, você influencia. Cada peça, cada palavra, cada silêncio constrói uma percepção que vive na cabeça do seu cliente, não na sua. O nosso trabalho é fazer essa percepção jogar a seu favor de propósito, não por sorte. Esse é o jeito Impulse.","cta":"Quer assumir o controle da percepção da sua marca em vez de torcer pra dar certo? Comenta PERCEPÇÃO.","hashtags":["#manifesto","#marca","#percepcao","#impulseone"],"direcao_visual":"Manifesto em tela cheia, tipografia Sora 800, alinhamento à esquerda, faixa de gradiente fina no rodapé como assinatura."},{"id":10,"pilar":"Oferta e Conversão","formato":"Carrossel","objetivo":"Fundo","tema":"O custo invisível de adiar","chamada":"Mês que vem eu começo. O problema é que o mês que vem nunca chega.","gancho_tendencia":"Janela de jul/ago (ferias, inverno gaucho, Dia dos Pais 09/08): quem adia perde o calendario de vendas.","gatilhos_mentais":["Aversão a perda","Urgência","Escassez","Inimigo comum"],"slides":["Cada mês parado é um mês de mercado entregue pro concorrente.","É cliente que te procurou, não te achou, e comprou de quem apareceu.","A indecisão tem custo. Ele não vem no boleto, vem no faturamento que não veio.","O melhor momento de começar era ano passado. O segundo melhor é agora."],"peca":"","legenda":"Adiar parece seguro porque não custa nada visível. Mas o custo da inação é o mais alto que existe: é tudo que poderia ter acontecido e não aconteceu. Enquanto você function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600);}
function setSave(s){document.getElementById('save').textContent=s;}

async function load(){
  try{const r=await fetch(SB_URL+'/rest/v1/app_settings?select=value&key=eq.'+STORE,{headers:H()});
    if(r.ok){const j=await r.json();online=true;if(j[0]&&j[0].value){state=JSON.parse(j[0].value);}setSave('sincronizado');return;}}catch(e){}
  online=false;const ls=localStorage.getItem(STORE);if(ls)state=JSON.parse(ls);setSave('offline (salvando no aparelho)');
}
let timer;
function save(){
  localStorage.setItem(STORE,JSON.stringify(state));
  setSave('salvando...');clearTimeout(timer);
  timer=setTimeout(async()=>{
    try{const r=await fetch(SB_URL+'/rest/v1/app_settings?on_conflict=key',{method:'POST',headers:H({'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify([{key:STORE,value:JSON.stringify(state),updated_at:new Date().toISOString()}])});
      setSave(r.ok?'sincronizado':'salvo no aparelho');}catch(e){setSave('salvo no aparelho');}
  },500);
}
function get(id){return state[id]||{status:null,coment:''};}
function setStatus(id,s){const g=get(id);g.status=g.status===s?null:s;state[id]=g;save();render();}
function setComent(id,v){const g=get(id);g.coment=v;state[id]=g;save();updateCounts();}

let filtro='todos';
function counts(){let a=0,r=0;CONTEUDOS.forEach(c=>{const s=get(c.id).status;if(s==='aprovado')a++;else if(s==='reprovado')r++;});return{a,r,p:CONTEUDOS.length-a-r};}
function updateCounts(){const c=counts();document.getElementById('counts').innerHTML=
  '<span class="pill"><b>'+META.total+'</b> conteúdos</span><span class="pill ok"><b>'+c.a+'</b> aprovados</span><span class="pill no"><b>'+c.r+'</b> reprovados</span><span class="pill"><b>'+c.p+'</b> pendentes</span>';
  const _pb=document.getElementById('progbar');if(_pb)_pb.style.width=(META.total?Math.round((c.a+c.r)/META.total*100):0)+'%';}

function cardHTML(c){
  const g=get(c.id);
  const estrut=(c.formato==='Carrossel'&&(c.slides||[]).length)
    ? '<div class="lbl">Carrossel</div><ol class="sl"><li><b>Capa.</b> '+esc(c.chamada)+'</li>'+c.slides.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>'
    : (c.peca?'<div class="peca">"'+esc(c.peca)+'"</div>':'');
  const tags=(c.hashtags||[]).map(h=>esc(h[0]==='#'?h:'#'+h)).join(' ');
  return '<div class="card st-'+(g.status||'')+'" data-id="'+c.id+'" data-st="'+(g.status||'')+'">'+
    '<div class="num">Conteúdo '+pad2(c.id)+' / '+pad2(META.total)+'</div>'+
    '<div class="tags"><span class="tag">'+esc(c.formato)+'</span><span class="tag">'+esc(c.pilar)+'</span>'+(c.objetivo?'<span class="tag">'+esc(c.objetivo)+'</span>':'')+'</div>'+
    '<div class="gan">Gancho: '+esc(c.gancho_tendencia)+'</div>'+
    '<div class="hook">'+esc(c.chamada)+'</div>'+estrut+
    '<div class="lbl">Legenda</div><div class="leg">'+esc(c.legenda)+'</div>'+
    '<div class="cta"><b>CTA</b><p>'+esc(c.cta)+'</p></div>'+
    (tags?'<div class="htags">'+tags+'</div>':'')+
    '<div class="actions">'+
      '<button class="act ap'+(g.status==='aprovado'?' on':'')+'" onclick="setStatus('+c.id+',\'aprovado\')">✓ Aprovar</button>'+
      '<button class="act re'+(g.status==='reprovado'?' on':'')+'" onclick="setStatus('+c.id+',\'reprovado\')">✕ Reprovar</button>'+
      '<input class="coment" placeholder="Comentário (opcional)" value="'+esc(g.coment||'')+'" oninput="setComent('+c.id+',this.value)">'+
    '</div></div>';
}
function render(){
  updateCounts();
  document.getElementById('per').textContent=META.periodo+(META.regiao?' · '+META.regiao:'');
  document.getElementById('resumo').textContent=META.resumo;
  const lista=CONTEUDOS.filter(c=>{const s=get(c.id).status||'pendente';
    if(filtro==='todos')return true;if(filtro==='pendentes')return s==='pendente';return s===filtro.replace(/s$/,'');});
  document.getElementById('lista').innerHTML=lista.map(cardHTML).join('')||'<p style="color:var(--dim);padding:30px 0">Nada aqui neste filtro.</p>';
}
function renderFiltros(){
  const fs=[['todos','Todos'],['pendentes','Pendentes'],['aprovados','Aprovados'],['reprovados','Reprovados']];
  document.getElementById('filtros').innerHTML=fs.map(f=>'<span class="chip'+(filtro===f[0]?' on':'')+'" onclick="setFiltro(\''+f[0]+'\')">'+f[1]+'</span>').join('');
}
function setFiltro(f){filtro=f;renderFiltros();render();}
function copiar(){
  let t='APROVACAO DE CONTEUDO — IMPULSE ONE ('+META.periodo+')\n\n';
  CONTEUDOS.forEach(c=>{const g=get(c.id);const st=g.status==='aprovado'?'APROVADO':g.status==='reprovado'?'REPROVADO':'pendente';
    t+=pad2(c.id)+'. ['+st+'] '+c.tema+' — "'+c.chamada+'"'+(g.coment?'\n   coment: '+g.coment:'')+'\n';});
  const c=counts();t+='\nResumo: '+c.a+' aprovados, '+c.r+' reprovados, '+c.p+' pendentes.';
  navigator.clipboard.writeText(t).then(()=>toast('Resumo copiado')).catch(()=>toast('Não consegui copiar'));
}
window.setStatus=setStatus;window.setComent=setComent;window.setFiltro=setFiltro;
document.getElementById('copiar').onclick=copiar;
(async()=>{await load();renderFiltros();render();})();
</script></body></html>
